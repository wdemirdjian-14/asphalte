services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: asphalte
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definissez POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: asphalte
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asphalte -d asphalte"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      args:
        # Inlinées dans le bundle client au moment du build
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://asphalte.walautao.fr}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://asphalte:${POSTGRES_PASSWORD}@db:5432/asphalte?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?generez-le avec openssl rand -hex 32}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://asphalte.walautao.fr}
      # Crée le compte administrateur au premier démarrage
      RUN_SEED: ${RUN_SEED:-true}
      SEED_DEMO: ${SEED_DEMO:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-contact@asphalte.fr}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?mot de passe du compte atelier}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Atelier Asphalte}
      # Envoi d'e-mails (IONOS)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_TO_ATELIER: ${MAIL_TO_ATELIER:-}
      # Notifications push de l'application installée
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:contact@asphalte.walautao.fr}
    ports:
      # Port exposé en local uniquement ; nginx proxifie dessus.
      # WEB_PORT permet d'éviter une collision si 3000 est déjà pris.
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      # Photos produits et photo du garage : doivent survivre aux mises à jour
      - uploads:/app/public/uploads

volumes:
  db-data:
  uploads:
