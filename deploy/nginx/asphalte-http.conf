# Étape 1 — configuration HTTP seule, le temps d'obtenir le certificat.
#
# À copier dans /etc/nginx/sites-available/asphalte.walautao.fr
# puis à activer :
#   ln -s /etc/nginx/sites-available/asphalte.walautao.fr /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Une fois certbot passé, il réécrit ce fichier avec le bloc HTTPS.
# La version finale attendue est dans asphalte-tls.conf.

server {
    listen 80;
    listen [::]:80;

    server_name asphalte.walautao.fr;

    # Validation ACME de Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Photos produits et photo du garage envoyées depuis le backoffice
    client_max_body_size 8m;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
