# Fragment de directives nginx — à utiliser quand on n'a PAS les droits root.
#
# Deux usages :
#
# 1. Panneau d'hébergement (Plesk, CloudPanel, ISPConfig, Virtualmin…) :
#    coller ce contenu dans le champ « directives nginx additionnelles »
#    du sous-domaine asphalte.walautao.fr. Sur Plesk, pensez aussi à
#    décocher « Proxy mode » (sinon Apache s'intercale).
#
# 2. Administrateur système : à inclure dans le bloc `server` du vhost
#    existant, ou à déposer dans un répertoire d'include du site.
#
# Adapter 3000 si WEB_PORT a une autre valeur dans le .env.

# Photos produits et photo du garage envoyées depuis le backoffice
client_max_body_size 30m;

location / {
    proxy_pass         http://127.0.0.1:3000;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
