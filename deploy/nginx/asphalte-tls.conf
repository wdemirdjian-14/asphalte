# Étape 2 — configuration finale, HTTP redirigé vers HTTPS.
#
# Normalement certbot génère ce bloc tout seul (`certbot --nginx`).
# Ce fichier sert de référence, ou de base si vous préférez écrire la
# configuration à la main avec un certificat déjà en place.
#
# Chemins des certificats à adapter si vous n'utilisez pas Let's Encrypt.

server {
    listen 80;
    listen [::]:80;

    server_name asphalte.walautao.fr;

    # Renouvellement du certificat sans couper le site
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Forme compatible avec toutes les versions de nginx.
    # Sur nginx >= 1.25.1 elle produit un avertissement de dépréciation ;
    # on peut alors écrire `listen 443 ssl;` + `http2 on;` à la place.
    # L'inverse casse : `http2 on;` sur nginx < 1.25.1 fait échouer
    # `nginx -t` avec « unknown directive "http2" », et bloque le
    # rechargement de TOUS les sites servis par ce nginx.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name asphalte.walautao.fr;

    ssl_certificate     /etc/letsencrypt/live/asphalte.walautao.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asphalte.walautao.fr/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Photos produits et photo du garage envoyées depuis le backoffice
    client_max_body_size 8m;

    # Next.js compresse déjà ses réponses, on n'ajoute pas de gzip ici.

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    access_log /var/log/nginx/asphalte.access.log;
    error_log  /var/log/nginx/asphalte.error.log;
}
